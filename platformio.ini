; ============================================================
;  BoardDetective - ESP32-S3 generico
; ============================================================
;  Cosi' com'e' dovrebbe funzionare subito, se colleghi il cavo
;  alla porta USB marcata COM / UART.
;  Le due modifiche che POTREBBERO servirti sono in fondo.
; ============================================================

[env:s3]
platform  = espressif32
board     = esp32-s3-devkitc-1
framework = arduino

monitor_speed = 115200

; Se la board va in crash, invece di numeri incomprensibili
; ti stampa il nome della funzione che ha causato il problema.
monitor_filters = esp32_exception_decoder

; Se l'upload da' errori, abbassa a 115200
upload_speed = 921600


; ============================================================
;  MODIFICA 1 - solo se usi la porta USB NATIVA
; ============================================================
;  (quella NON marcata COM/UART, o l'unica se ce n'e' una sola)
;  Senza queste due righe il monitor seriale resta muto.
;  Togli il ";" davanti a entrambe:
;
; build_flags =
;     -D ARDUINO_USB_CDC_ON_BOOT=1
;     -D ARDUINO_USB_MODE=1


; ============================================================
;  MODIFICA 2 - solo se il tuo modulo ha la PSRAM
; ============================================================
;  Guarda la sigla stampata sul modulo metallico della board.
;
;  Finisce per R8 (es. N16R8) -> togli il ";" da queste 3 righe:
;
; board_build.arduino.memory_type = qio_opi
; build_flags =
;     -D BOARD_HAS_PSRAM
;
;  Finisce per R2 (es. N8R2) -> togli il ";" da queste 2 righe:
;
; build_flags =
;     -D BOARD_HAS_PSRAM
;
;  Non ha nessuna R -> non toccare niente.
;
;  ATTENZIONE: se scommenti "build_flags" sia qui che nella
;  MODIFICA 1, unisci le righe sotto un solo "build_flags =".
;
;  Se hai 16 MB di flash (sigla N16), aggiungi anche:
;
; board_upload.flash_size = 16MB
; board_build.partitions  = default_16MB.csv
